services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abujapi-profile
    ports:
      - "8547:8547"
    environment:
      - NODE_ENV=production
      - PORT=8547
      - NEXT_PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8547/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Resource limits untuk mencegah abuse
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Read-only root filesystem untuk keamanan tambahan
    # (uncomment jika tidak ada write ke filesystem)
    # read_only: true
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network configuration
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
